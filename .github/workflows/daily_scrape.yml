name: Daily PSP Scrape

on:
  push:
    paths:
      - 'Dataset/Raw/File2_Raw/**'
      - 'Dataset/Raw/File3_Raw/**'
  workflow_dispatch:        # manual trigger from GitHub Actions tab
    inputs:
      date:
        description: 'Override data date (YYYY-MM-DD). Leave blank for auto (yesterday).'
        required: false
        default: ''
      scan:
        description: 'Parse all unparsed files already in File3_Raw (yes/no).'
        required: false
        default: 'no'

permissions:
  contents: write   # needed to commit updated CSVs back to repo

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Python ──────────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. Dependencies ────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas openpyxl pdfplumber requests urllib3 xlrd "kaggle>=1.8.0" \
                      numpy scikit-learn lightgbm

      # ── 4. Run scraper ─────────────────────────────────────────────────────
      - name: Run daily update
        id: scrape
        run: |
          if [ "${{ github.event.inputs.scan }}" = "yes" ] || [ "${{ github.event_name }}" = "push" ]; then
            python Scrapings/update_live.py --scan
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            python Scrapings/update_live.py --date "${{ github.event.inputs.date }}"
          else
            python Scrapings/update_live.py
          fi
        # Exit 1 = not published yet (not a failure, just retry later)
        continue-on-error: true

      - name: Check scrape outcome
        id: outcome
        run: |
          if [ "${{ steps.scrape.outcome }}" = "failure" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Scrape exited with error — file not available yet or parse failed."
          else
            # Check if CSVs or raw folders changed
            git diff --quiet Dataset/study1_daily.csv Dataset/study2_scada.csv Dataset/study3_states.csv \
              && echo "changed=false" >> $GITHUB_OUTPUT \
              || echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # ── 5. Study 1 next-day forecast ───────────────────────────────────────
      # Retrains fresh each run (seconds, not minutes -- see ML/Study1/predict.py's
      # notes on why no separate model artifact is stored). Runs only when new
      # data actually arrived, and only after the CSV update so it forecasts from
      # today's freshest row. Its output (Dataset/predictions/study1_forecast.csv)
      # is committed in the same commit as the day's data update below.
      - name: Run Study 1 forecast
        if: steps.outcome.outputs.changed == 'true'
        run: python ML/Study1/predict.py
        # A forecasting failure should never block the day's actual data from being
        # committed -- data freshness matters more than the forecast. If this fails,
        # the log simply doesn't get a new row today; it catches up next successful run.
        continue-on-error: true

      # ── 6. Commit raw file + updated CSVs + forecast log ──────────────────
      - name: Commit and push
        if: steps.outcome.outputs.changed == 'true'
        run: |
          git config user.name  "Dedu"
          git config user.email "dedu[bot]@users.noreply.github.com"
          git add Dataset/study1_daily.csv Dataset/study2_scada.csv Dataset/study3_states.csv \
                  Dataset/predictions/study1_forecast.csv \
                  Dataset/Raw/File2_Raw/ Dataset/Raw/File3_Raw/
          git commit -m "chore: daily PSP update $(date -u +%Y-%m-%d)"
          git push

      # ── 7. Push updated datasets to Kaggle ────────────────────────────────
      # Dataset/Raw/ contains thousands of raw XLS/PDF files that must not
      # be uploaded to Kaggle. Copy only the CSVs and metadata to a temp
      # directory and push from there.
      - name: Push to Kaggle
        if: steps.outcome.outputs.changed == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p /tmp/kaggle_push
          cp Dataset/study1_daily.csv \
             Dataset/study2_scada.csv \
             Dataset/study1_hourly.csv \
             Dataset/study3_states.csv \
             Dataset/data_dictionary.xlsx \
             Dataset/README.md \
             Dataset/dataset-metadata.json \
             /tmp/kaggle_push/
          kaggle datasets version \
            -p /tmp/kaggle_push/ \
            -m "Daily PSP update $(date -u +%Y-%m-%d)"

      # ── 8. Summary ─────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.outcome.outputs.changed }}" = "true" ]; then
            echo "✅ CSVs updated and pushed to GitHub + Kaggle."
          else
            echo "ℹ️  No new data available yet — will retry at next scheduled run."
          fi
